name: Build Android APK

on:
  push:
    branches: [ main, master ] # Uruchom przy każdympushu do głównej gałęzi
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17' # Dostosuj wersję Javy do wymagań swojego projektu (np. 11, 17, 21)

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # Opcjonalnie: Zapisanie pliku APK, aby można go było pobrać z zakładki "Actions"
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
